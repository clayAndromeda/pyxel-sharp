<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Pyxel Jump (Pyxel-Sharp)</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 8px;
      background: #222; color: #888; font-family: monospace;
    }
    /* Emscripten's SDL2 sizes its framebuffer from the canvas CSS size, so an
       explicit size is required (an unstyled canvas collapses to ~1px). */
    canvas {
      width: min(90vw, calc(85vh * 4 / 3));
      aspect-ratio: 4 / 3;
      image-rendering: pixelated;
      outline: none;
    }
  </style>
</head>
<body>
  <p id="status">loading .NET runtime...</p>
  <canvas id="canvas" width="160" height="120" tabindex="1"></canvas>
  <p>&larr; / &rarr; move &middot; land on floors &middot; catch fruit</p>
  <script type="module">
    import { bootPyxel } from './pyxel-boot.js';
    // The game plays music from startup, so gate on a click: browsers only
    // allow audio to start inside a user gesture.
    await bootPyxel({
      clickToStart: true,
      assets: [{ url: './assets/jump_game.pyxres', path: '/assets/jump_game.pyxres' }],
    });
  </script>
</body>
</html>
